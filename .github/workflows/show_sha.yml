name: Get Keystore SHA Fingerprints

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/show_sha.yml'

jobs:
  get_sha:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Fingerprints
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
            echo "### Release Keystore Fingerprints:" >> $GITHUB_STEP_SUMMARY
            keytool -list -v -keystore upload-keystore.jks \
              -alias "${{ secrets.KEY_ALIAS }}" \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > cert_info.txt
            cat cert_info.txt
            
            SHA1=$(grep "SHA1:" cert_info.txt | head -1 | awk '{print $2}')
            SHA256=$(grep "SHA256:" cert_info.txt | head -1 | awk '{print $2}')
            
            echo "| Type | Fingerprint |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **SHA-1** | \`$SHA1\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **SHA-256** | \`$SHA256\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No KEYSTORE_BASE64 found in secrets"
          fi
