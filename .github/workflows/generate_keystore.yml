name: Generate Play Store Keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore Password (min 6 chars)'
        required: true
        default: 'Ultra10thKey2026!'
      key_alias:
        description: 'Key Alias name'
        required: true
        default: 'ultra10th'
      dname:
        description: 'Distinguished Name / Organization'
        required: false
        default: 'CN=Ultra 10th, OU=Education, O=Ultra10th, L=Delhi, C=IN'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        id: gen
        run: |
          mkdir -p keystore_output
          keytool -genkeypair -v \
            -keystore keystore_output/upload-keystore.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.store_password }}" \
            -dname "${{ github.event.inputs.dname }}"

          # Encode to base64
          BASE64_KEY=$(base64 -w 0 keystore_output/upload-keystore.jks)

          # Output summary to GitHub Actions UI
          echo "## Play Store Upload Keystore Generated Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### IMPORTANT: Save these 4 Secrets in GitHub" >> $GITHUB_STEP_SUMMARY
          echo "Go to: **Repo Settings -> Secrets and variables -> Actions -> New repository secret**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Name | Secret Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEYSTORE_PASSWORD\` | \`${{ github.event.inputs.store_password }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEY_PASSWORD\` | \`${{ github.event.inputs.store_password }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEY_ALIAS\` | \`${{ github.event.inputs.key_alias }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### For \`KEYSTORE_BASE64\` Secret Value:" >> $GITHUB_STEP_SUMMARY
          echo "Copy the full base64 string below and set as secret \`KEYSTORE_BASE64\`:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$BASE64_KEY" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Download Backup: Also download the attached artifact \`upload-keystore.jks\` below and keep it safely backed up." >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-upload-keystore
          path: keystore_output/upload-keystore.jks
          retention-days: 7
